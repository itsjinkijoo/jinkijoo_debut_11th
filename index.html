        body {
            font-family: 'fromsol', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Sans KR', sans-serif;

            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        .subtitle {
            text-align: center;
            color: var(--primary-color);

        .form-container {

            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 35px;
        }

        .form-container h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ffd1e6;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-color);
            background-color: #fff9fb;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--primary-color);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;

            background-color: #ff65a3;
        }

            transform: scale(0.98);
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .message-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .message-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 25px rgba(255, 126, 185, 0.25);
        }

        .message-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 6px;
            background: linear-gradient(90deg, #ffafcc, #ffc8dd);
        }

        /* 기본 상태: 2줄만 보이고 말줄임 처리 */
        .message-content {
            font-size: 1.15rem;
            line-height: 1.9;
            color: #555;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 20px;
            
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 펼쳐졌을 때의 상태 */
        .message-card.expanded .message-content {
            display: block;
            -webkit-line-clamp: unset;
            overflow: visible;
        }

            font-size: 0.9rem;
            color: #bbb;
            text-align: center;
            margin-top: 10px;
            font-weight: normal;

            align-items: center;
            margin-top: 15px;
        }

            font-weight: 800;
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .card-buttons {
            display: flex;
            gap: 8px;
        }

        .action-btn {

            border-radius: 10px;

            font-family: inherit;
            font-weight: bold;

                <div class="message-card" onclick="toggleCard(event, this)">
                    <div class="message-content">${escapeHtml(item.content)}</div>
                    <div class="expand-hint">👇 누르면 전체 내용이 보여요!</div>
                    <div class="card-footer">
                        <div class="message-author">${escapeHtml(item.author)}</div>
                        <div class="card-buttons">
                            <button class="action-btn edit-btn" onclick="openEditModal(event, ${index})">수정</button>
                            <button class="action-btn delete-btn" onclick="deleteCard(event, ${index})">삭제</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 새 글 등록 함수
        function addMessage(event) {
            event.preventDefault();
            const authorInput = document.getElementById('authorInput');
            const passwordInput = document.getElementById('passwordInput');
            const contentInput = document.getElementById('contentInput');

            const newPost = {
                author: authorInput.value.trim(),
                password: passwordInput.value.trim(),
                content: contentInput.value.trim()
            };

            // 배열 맨 앞에 추가
            guestbookData.unshift(newPost);
            saveToLocalStorage(); // 영구 저장
            
            // 화면 렌더링 갱신
            renderFeed();

            // 입력창 초기화
            authorInput.value = '';
            passwordInput.value = '';
            contentInput.value = '';

            alert("진기주 배우에게 응원 메세지 남겨 주셔서 감사합니다 ♡");
        }

        // 카드를 누르면 펼쳐지거나 접히는 함수 (버튼 클릭 시 카드 펼쳐짐 방지)
        function toggleCard(event, card) {
            if(event.target.tagName === 'BUTTON') return;
            card.classList.toggle('expanded');
        }

        // 수정 모달창 열기 (비밀번호 확인 후 닉네임과 내용 입력창 채우기)
        function openEditModal(event, index) {
            event.stopPropagation(); // 카드 펼쳐짐 이벤트 차단
            const inputPw = prompt("등록할 때 입력했던 4자리 비밀번호를 입력하세요:");
            
            if (inputPw === null) return; // 취소 누른 경우

            if (inputPw === guestbookData[index].password) {
                currentEditIndex = index;
                // 기존 작성된 닉네임과 내용을 수정 모달창의 입력칸에 미리 띄워줌
                document.getElementById('editAuthorInput').value = guestbookData[index].author;
                document.getElementById('editContentInput').value = guestbookData[index].content;
                
                // 모달창 띄우기
                document.getElementById('editModal').style.display = 'flex';
            } else {
                alert("비밀번호가 일치하지 않습니다!");
            }
        }

        // 수정 모달창 닫기
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            currentEditIndex = null;
        }

        // 수정 완료 저장 함수
        function saveEditedMessage(event) {
            event.preventDefault();
            if (currentEditIndex !== null) {
                const newAuthor = document.getElementById('editAuthorInput').value.trim();
                const newContent = document.getElementById('editContentInput').value.trim();

                // 닉네임과 내용 모두 수정 반영
                guestbookData[currentEditIndex].author = newAuthor;
                guestbookData[currentEditIndex].content = newContent;

                saveToLocalStorage(); // 영구 저장
                renderFeed(); // 화면 갱신
                closeEditModal(); // 모달 닫기
                alert("글이 성공적으로 수정되었습니다! ✨");
            }
        }

        // 삭제 함수 (관리자 비밀번호 "0111" 입력 시에만 삭제됨)
        function deleteCard(event, index) {
            event.stopPropagation(); // 카드 펼쳐짐 이벤트 차단
            const password = prompt("관리자 비밀번호를 입력하세요:");
            
            if (password === "0111") {
                guestbookData.splice(index, 1); // 배열에서 해당 글 제거
                saveToLocalStorage(); // 변경 사항 영구 저장
                renderFeed(); // 화면 새로고침
                alert("글이 삭제되었습니다.");
            } else if (password !== null) {
                alert("비밀번호가 틀렸습니다!");
            }
        }

        function escapeHtml(text) {
            if(!text) return text;
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function initParticles() {
            await tsParticles.load({
                id: "tsparticles",
                options: {
                    preset: "bubbles",
                    fullScreen: { enable: true },
                    particles: {
                        number: { value: 0 },
                        color: { value: ["#ffafcc", "#bde0fe", "#ffc8dd", "#fff"] },
                        opacity: {
                            value: { min: 0.4, max: 0.8 },
                            animation: { enable: true, speed: 1.5, sync: false, startValue: "max", destroy: "min" }
                        },
                        size: {
                            value: { min: 3, max: 8 },
                            animation: { enable: true, speed: 6, sync: false, startValue: "max", destroy: "min" }
                        },
                        move: {
                            enable: true,
                            speed: 3,
                            direction: "none",
                            random: true,
                            straight: false,
                            outModes: { default: "destroy" }
                        }
                    }
                }
            });
        }

        function createBubbleAt(event) {
            const particles = tsParticles.domItem(0);
            if (!particles) return;
            particles.addParticle({ x: event.clientX, y: event.clientY }, 20);
        }
    </script>
</body>
</html>
