<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배우 진기주 데뷔 11주년 축하해</title>
    <meta property="og:title" content="배우 진기주 데뷔 11주년 축하해 💕">
    <meta property="og:description" content="주디스들과 함께하는 진기주 배우 데뷔 11주년 기념 방명록 공간입니다. 따뜻한 메시지를 남겨주세요!">
    <meta property="og:image" content="https://github.com/itsjinkijoo/jinkijoo_debut_11th/blob/main/KakaoTalk_20260829_230415981.jpg?raw=true">
    <meta property="og:url" content="https://itsjinkijoo.github.io/jinkijoo_debut_11th/">

    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/engine@3.1.0/tsparticles.engine.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/preset-bubbles@3.1.0/tsparticles.preset.bubbles.min.js"></script>
    <style>
        @font-face {
            font-family: 'fromsol';
            src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607161334@griun-fromsol-rg/griun-fromsol-rg/Griun_Fromsol-Rg.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'KerisKedyuche';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_R.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'KerisKedyuche';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_B.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        * {
            cursor: url('https://cdn.cursors-4u.net/previews/disney-minnie-mouse-01d68b82-32.webp') 32 32, auto !important;
        }

        :root {
            --primary-color: #ff7eb9;
            --bg-color: #fff5f8;
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
            --shadow: 0 10px 20px rgba(255, 126, 185, 0.15);
        }

        body {
            font-family: 'fromsol', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        .subtitle {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: clamp(2rem, 7vw, 3rem);
            font-weight: 700;
            text-shadow: 2px 2px 0px #fff;
            word-keep-all;
            font-family: 'KerisKedyuche', sans-serif !important;
        }

        .form-container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
        }

        .form-container h3 {
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #ffd1e6;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-color);
            background-color: #fff9fb;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--primary-color);
        }

        .form-textarea {
            resize: vertical;
            min-height: 90px;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .submit-btn:hover {
            background-color: #ff65a3;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 22px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .message-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 25px rgba(255, 126, 185, 0.25);
        }

        .message-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 5px;
            background: linear-gradient(90deg, #ffafcc, #ffc8dd);
        }

        .message-content {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #555;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-card.expanded .message-content {
            display: block;
            -webkit-line-clamp: unset;
            overflow: visible;
        }

        .expand-hint {
            font-size: 0.85rem;
            color: #bbb;
            text-align: center;
            margin-top: 8px;
            font-weight: normal;
        }

        .message-card.expanded .expand-hint {
            display: none;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .message-author {
            font-weight: 800;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .card-buttons {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            border: none;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .edit-btn {
            background-color: #fff0f5;
            color: #ff65a3;
        }

        .edit-btn:hover {
            background-color: #ffe0ee;
        }

        .delete-btn {
            background-color: #ffe6ee;
            color: #ff4d94;
        }

        .delete-btn:hover {
            background-color: #ffccd5;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal-container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-sizing: border-box;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-cancel-btn {
            background-color: #f1f1f1;
            color: #777;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .modal-cancel-btn:hover {
            background-color: #e2e2e2;
        }

        #tsparticles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body onpointerdown="createBubbleAt(event)">

    <div id="tsparticles"></div>

    <div class="container">
        <div class="subtitle">주디스가 기주에게</div>

        <div class="form-container">
            <h3>💌 축하 메시지 남기기</h3>
            <form id="guestbookForm" onsubmit="addMessage(event)">
                <div class="form-group">
                    <input type="text" id="authorInput" class="form-input" placeholder="닉네임 (예: 주디스)" required>
                </div>
                <div class="form-group">
                    <input type="password" id="passwordInput" class="form-input" placeholder="비밀번호 4자리 (글 수정 시 필요해요!)" maxlength="4" pattern="[0-9]{4}" required>
                </div>
                <div class="form-group">
                    <textarea id="contentInput" class="form-textarea" placeholder="기주 배우님에게 전할 따뜻한 메시지를 남겨주세요! (이모티콘도 사용 가능해요 💕)" required></textarea>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">등록하기 ✨</button>
            </form>
        </div>

        <div class="feed-container" id="feedContainer"></div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal-container">
            <h3>✏️ 축하 메시지 수정하기</h3>
            <form id="editForm" onsubmit="saveEditedMessage(event)">
                <div class="form-group">
                    <input type="text" id="editAuthorInput" class="form-input" placeholder="닉네임" required>
                </div>
                <div class="form-group">
                    <textarea id="editContentInput" class="form-textarea" placeholder="메시지 내용" required></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="modal-cancel-btn" onclick="closeEditModal()">취소</button>
                    <button type="submit" class="submit-btn">수정 완료 ✨</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK 불러오기 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB6cr4TZJJw7W4W5fjifKWIKINrOganaqI",
            authDomain: "jinkijoo-guestbook.firebaseapp.com",
            projectId: "jinkijoo-guestbook",
            storageBucket: "jinkijoo-guestbook.firebasestorage.app",
            messagingSenderId: "701000853994",
            appId: "1:701000853994:web:082ca51178a595490f6a93"
        };
         
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentEditId = null;
        let guestbookData = [];

        window.addEventListener('DOMContentLoaded', () => {
            initParticles();
            loadMessages();
        });

        async function loadMessages() {
            try {
                const querySnapshot = await getDocs(collection(db, "messages"));
                guestbookData = [];
                querySnapshot.forEach((docSnap) => {
                    guestbookData.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                guestbookData.sort((a, b) => b.createdAt - a.createdAt);
                renderFeed();
            } catch (error) {
                console.error("데이터를 불러오는 중 오류 발생: ", error);
                feedContainer.innerHTML = `<div style="text-align:center; color:#ff7eb9; font-size:1.05rem; padding:20px; line-height: 1.6;">
                    💕 Firebase 설정이 아직 완료되지 않았거나 연결 중입니다!<br>코드 안의 <code style="background:#ffe6ee; padding:2px 6px; border-radius:4px;">firebaseConfig</code> 정보를 채워주세요!
                </div>`;
            }
        }

        window.addMessage = async function(event) {
            event.preventDefault();
            const authorInput = document.getElementById('authorInput');
            const passwordInput = document.getElementById('passwordInput');
            const contentInput = document.getElementById('contentInput');

            try {
                await addDoc(collection(db, "messages"), {
                    author: authorInput.value.trim(),
                    password: passwordInput.value.trim(),
                    content: contentInput.value.trim(),
                    createdAt: Date.now()
                });

                authorInput.value = '';
                passwordInput.value = '';
                contentInput.value = '';

                alert("진기주 배우에게 응원 메세지를 남겨 주셔서 감사합니다 ♡");
                loadMessages();
            } catch (error) {
                alert("등록 중 오류가 발생했습니다.");
                console.error(error);
            }
        }

        function renderFeed() {
            if (!guestbookData || guestbookData.length === 0) {
                feedContainer.innerHTML = `<div style="text-align:center; color:#ff7eb9; font-size:1.1rem; padding:20px;">아직 작성된 메시지가 없어요! 첫 글을 남겨보세요 💕</div>`;
                return;
            }

            feedContainer.innerHTML = guestbookData.map((item) => `
                <div class="message-card" onclick="toggleCard(event, this)">
                    <div class="message-content">${escapeHtml(item.content)}</div>
                    <div class="expand-hint">👇 누르면 전체 내용이 보여요!</div>
                    <div class="card-footer">
                        <div class="message-author">${escapeHtml(item.author)}</div>
                        <div class="card-buttons">
                            <button class="action-btn edit-btn" onclick="openEditModal(event, '${item.id}')">수정</button>
                            <button class="action-btn delete-btn" onclick="deleteCard(event, '${item.id}')">삭제</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.toggleCard = function(event, card) {
            if(event.target.tagName === 'BUTTON') return;
            card.classList.toggle('expanded');
        }

        window.openEditModal = function(event, id) {
            event.stopPropagation();
            const targetItem = guestbookData.find(item => item.id === id);
            const inputPw = prompt("등록할 때 입력했던 4자리 비밀번호를 입력하세요:");
            
            if (inputPw === null) return;

            if (inputPw === targetItem.password || inputPw === "0225") {
                currentEditId = id;
                document.getElementById('editAuthorInput').value = targetItem.author;
                document.getElementById('editContentInput').value = targetItem.content;
                document.getElementById('editModal').style.display = 'flex';
            } else {
                alert("비밀번호가 일치하지 않습니다!");
            }
        }

        window.closeEditModal = function() {
            document.getElementById('editModal').style.display = 'none';
            currentEditId = null;
        }

        window.saveEditedMessage = async function(event) {
            event.preventDefault();
            if (currentEditId !== null) {
                const newAuthor = document.getElementById('editAuthorInput').value.trim();
                const newContent = document.getElementById('editContentInput').value.trim();

                try {
                    const docRef = doc(db, "messages", currentEditId);
                    await updateDoc(docRef, {
                        author: newAuthor,
                        content: newContent
                    });

                    loadMessages();
                    closeEditModal();
                    alert("글이 성공적으로 수정되었습니다! ✨");
                } catch (error) {
                    alert("수정 중 오류가 발생했습니다.");
                }
            }
        }

        window.deleteCard = async function(event, id) {
            event.stopPropagation();
            const password = prompt("삭제 비밀번호(0225)를 입력하세요:");
            
            if (password === "0225") {
                try {
                    await deleteDoc(doc(db, "messages", id));
                    loadMessages();
                    alert("글이 삭제되었습니다.");
                } catch (error) {
                    alert("삭제 중 오류가 발생했습니다.");
                }
            } else if (password !== null) {
                alert("비밀번호가 틀렸습니다!");
            }
        }

        function escapeHtml(text) {
            if(!text) return text;
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>

    <script>
        async function initParticles() {
            await tsParticles.load({
                id: "tsparticles",
                options: {
                    preset: "bubbles",
                    fullScreen: { enable: true },
                    particles: {
                        number: { value: 0 },
                        color: { value: ["#ffafcc", "#bde0fe", "#ffc8dd", "#fff"] },
                        opacity: {
                            value: { min: 0.4, max: 0.8 },
                            animation: { enable: true, speed: 1.5, sync: false, startValue: "max", destroy: "min" }
                        },
                        size: {
                            value: { min: 3, max: 8 },
                            animation: { enable: true, speed: 6, sync: false, startValue: "max", destroy: "min" }
                        },
                        move: {
                            enable: true,
                            speed: 3,
                            direction: "none",
                            random: true,
                            straight: false,
                            outModes: { default: "destroy" }
                        }
                    }
                }
            });
        }

        function createBubbleAt(event) {
            const particles = tsParticles.domItem(0);
            if (!particles) return;
            particles.addParticle({ x: event.clientX, y: event.clientY }, 20);
        }
    </script>
</body>
</html>
